name: "Configure Sandbox Permissions"
description: "Configure WebDAV and OCAPI Data API permissions in Business Manager after a sandbox reset"
inputs:
  SFCC_AUTOMATED_TESTS_USERNAME:
    description: "SFCC Automated Tests Username"
    required: true
  SFCC_AUTOMATED_TESTS_PASSWORD:
    description: "SFCC Automated Tests Password"
    required: true
  SFCC_AUTOMATED_TESTS_SECRET_KEY:
    description: "SFCC Automated Tests Secret Key"
    required: true
  SFCC_BASE_URL:
    description: "SFCC Base URL"
    required: true
  ADMIN_OCAPI_KEY:
    description: "The OCAPI client ID to grant WebDAV and OCAPI Data API permissions to"
    required: true
  SECONDARY_OCAPI_KEY:
    description: "A second OCAPI client ID to grant code version, job execution and site cartridge OCAPI Data API permissions to"
    required: true

runs:
  using: composite
  steps:

    - name: Mask credentials
      env:
        SFCC_AUTOMATED_TESTS_USERNAME: ${{ inputs.SFCC_AUTOMATED_TESTS_USERNAME }}
        SFCC_AUTOMATED_TESTS_PASSWORD: ${{ inputs.SFCC_AUTOMATED_TESTS_PASSWORD }}
        SFCC_AUTOMATED_TESTS_SECRET_KEY: ${{ inputs.SFCC_AUTOMATED_TESTS_SECRET_KEY }}
        ADMIN_OCAPI_KEY: ${{ inputs.ADMIN_OCAPI_KEY }}
        SECONDARY_OCAPI_KEY: ${{ inputs.SECONDARY_OCAPI_KEY }}
      run: |
        for value in "$SFCC_AUTOMATED_TESTS_USERNAME" "$SFCC_AUTOMATED_TESTS_PASSWORD" "$SFCC_AUTOMATED_TESTS_SECRET_KEY" "$ADMIN_OCAPI_KEY" "$SECONDARY_OCAPI_KEY"; do
          if [ -n "$value" ]; then echo "::add-mask::$value"; fi
        done
      shell: bash

    - name: Setup-java
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 21

    - name: Install Chrome
      working-directory: ${{ github.action_path }}/../playwright_tools
      run: |
        sudo mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --force chrome"
      shell: bash

    - name: Configure sandbox permissions
      working-directory: ${{ github.action_path }}/../playwright_tools
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        SFCC_AUTOMATED_TESTS_USERNAME: ${{ inputs.SFCC_AUTOMATED_TESTS_USERNAME }}
        SFCC_AUTOMATED_TESTS_PASSWORD: ${{ inputs.SFCC_AUTOMATED_TESTS_PASSWORD }}
        SFCC_AUTOMATED_TESTS_SECRET_KEY: ${{ inputs.SFCC_AUTOMATED_TESTS_SECRET_KEY }}
        SFCC_BASE_URL: ${{ inputs.SFCC_BASE_URL }}
        ADMIN_OCAPI_KEY: ${{ inputs.ADMIN_OCAPI_KEY }}
        SECONDARY_OCAPI_KEY: ${{ inputs.SECONDARY_OCAPI_KEY }}
      run: |
        mvn clean test -Dtest=ConfigureSandboxPermissionsTest
      shell: bash
